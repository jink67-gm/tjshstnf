textarea{min-height:90px;resize:vertical}
mark.v{background:#FFD9C2;color:var(--navy);border-radius:4px;padding:0 2px}

async function createRoom() {
  const setId = document.querySelector('input[name=set]:checked').value;
  try {
    let code;
    for (let i = 0; i < 20; i++) { code = String(Math.floor(1000 + Math.random() * 9000)); const s = await getDoc(doc(db, "rooms", code)); if (!s.exists()) break; }
    await setDoc(doc(db, "rooms", code), { setId, round: 1, rubric: "v1", revealed: false, createdAt: serverTimestamp() });
    location.hash = "host/" + code;
  } catch (e) { console.error(e); toast("방을 만들지 못했습니다. Firestore 설정을 확인해 주세요."); }
}

    const people = cur.length;
    const stats = set.answers.map((a, i) => {

      const top = Math.max(0, ...Object.values(counts));
      return { counts, n, agree: n ? top / n : 0 };
    });
    const agreeAvg = (r) => {
      const rs = scores.filter((s) => s.round === r); if (!rs.length) return null;
      let sum = 0, k = 0;
      set.answers.forEach((a, i) => { const c = {}; let n = 0; rs.forEach((s) => { const v = s.scores && s.scores[i]; if (v !== undefined && v !== null) { c[v] = (c[v] || 0) + 1; n++; } }); if (n) { sum += Math.max(...Object.values(c)) / n; k++; } });

    </div>

        <div class="seg"><button data-rb="v1" class="${room.rubric === "v1" ? "on" : ""}">모호한 기준</button><button data-rb="v2" class="${room.rubric === "v2" ? "on" : ""}">구체적인 기준</button></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn ${room.revealed ? "ghost" : "orange"}" id="reveal">${room.revealed ? "기준 점수 숨기기" : "기준 점수·해설 공개"}</button>
        ${room.round === 1 ? `<button class="btn teal" id="round2">2차 채점 시작(구체적인 기준)</button>` : `<button class="btn ghost" id="round1">1차 결과 보기로 돌아가기</button>`}
      </div>
      <p class="note" style="margin:10px 0 0">권장 순서: 모호한 기준으로 1차 채점 → 점수가 갈린 답안 협의 → 2차 채점 시작 → 기준 점수·해설 공개</p>
    </div>
    <div class="card"><h2>답안별 점수 분포 (${room.round}차)</h2>
      ${set.answers.map((a, i) => {
        const st = stats[i]; const max = Math.max(1, ...Object.values(st.counts));
        const badge = st.n < 2 ? "" : st.agree < 0.7 ? `<span class="split">의견이 갈림</span>` : `<span class="agree">대체로 일치</span>`;
        return `<div class="ans"><div class="row space"><div class="who">학생 답안 ${i + 1}</div><div class="row">${badge}<span class="note">응답 ${st.n}명</span></div></div>

          ${room.revealed ? `<div class="reveal"><b>기준 점수 ${a.gold}점</b> · ${esc(a.why)}</div>` : ""}</div>`;

    const r1 = document.getElementById("round1"); if (r1) r1.onclick = () => updateDoc(doc(db, "rooms", code), { round: 1, rubric: "v1" });
  };
  unsubs.push(onSnapshot(doc(db, "rooms", code), (s) => { if (!s.exists()) { $app.innerHTML = `<div class="card">방을 찾을 수 없습니다.</div>`; return; } room = s.data(); render(); }, (e) => { console.error(e); toast("연결 오류: Firestore 설정을 확인해 주세요."); }));
  unsubs.push(onSnapshot(collection(db, "rooms", code, "scores"), (qs) => { scores = qs.docs.map((d) => d.data()); render(); }));
}

function clinic(idx = 0, score = { hit: 0, total: 0 }) {
  if (idx >= CLINIC.length) {
    $app.innerHTML = `<div class="card" style="text-align:center"><span class="tag">문항 검토 클리닉</span><h2 style="margin-top:10px">연습을 마쳤습니다</h2>
      <div class="stat">${score.hit} / ${score.total}</div><p class="muted">찾아야 할 문제 유형 중 정확히 진단한 수</p>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn teal" id="again">다시 하기</button><button class="btn ghost" id="toHome">처음으로</button></div></div>`;
    document.getElementById("again").onclick = () => clinic(0, { hit: 0, total: 0 });
    document.getElementById("toHome").onclick = () => { location.hash = ""; };
    return;
  }
  const c = CLINIC[idx];
  $app.innerHTML = `
  <div class="card"><div class="row space"><span class="tag">문항 검토 클리닉 · ${idx + 1} / ${CLINIC.length}</span><span class="note">진단 점수 ${score.hit} / ${score.total}</span></div>
    <div class="progress" style="margin-top:10px"><div style="width:${(idx / CLINIC.length) * 100}%"></div></div></div>
  <div class="card"><h2>이 문항의 문제는 무엇일까요?</h2><div class="box item">${nl(c.item)}</div>
    <p class="muted" style="margin:14px 0 4px">해당하는 문제 유형을 모두 고르세요.</p>
    <div id="types">${Object.entries(TYPES).map(([k, v]) => `<label class="chk" data-k="${k}"><input type="checkbox" value="${k}"><span>${esc(v)}</span></label>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn orange" id="check">진단 확인</button></div>
    <div id="result"></div></div>`;
  document.getElementById("check").onclick = () => {
    const chosen = [...document.querySelectorAll("#types input:checked")].map((i) => i.value);
    if (!chosen.length) return toast("문제 유형을 하나 이상 골라 주세요.");
    let hit = 0;
    document.querySelectorAll("#types label").forEach((l) => {
      const k = l.dataset.k, inAns = c.ans.includes(k), picked = chosen.includes(k);
      l.querySelector("input").disabled = true;
      if (inAns && picked) { l.classList.add("ok"); hit++; } else if (inAns) l.classList.add("miss"); else if (picked) l.classList.add("wrong");
    });
    const wrong = chosen.filter((k) => !c.ans.includes(k)).length;
    const gained = Math.max(0, hit - wrong);
    score.hit += gained; score.total += c.ans.length;
    document.getElementById("check").remove();
    document.getElementById("result").innerHTML = `
      <div class="reveal" style="margin-top:14px"><b>${hit === c.ans.length && !wrong ? "정확하게 진단했습니다." : "정답 유형을 확인해 보세요."}</b><br>
        <span class="note">초록: 맞게 고른 유형 · 주황: 놓친 유형 · 빨강: 해당하지 않는 유형</span><br><br>${esc(c.why)}</div>
      <p class="muted" style="margin:14px 0 6px">수정 예시</p><div class="box item" style="background:var(--tealL)">${nl(c.fix)}</div>
      <div class="row" style="margin-top:12px"><button class="btn teal" id="next">다음 문항</button></div>`;
    document.getElementById("next").onclick = () => clinic(idx + 1, score);
  };
}

function highlightVague(text) {
  let h = esc(text); const found = [];
  VAGUE.forEach((w) => { const ww = w.trim(); if (!ww) return; if (text.includes(ww)) { found.push(ww); h = h.split(esc(ww)).join(`<mark class="v">${esc(ww)}</mark>`); } });
  return { h, found };
}

    const all = store("sl_polish") || {}; all[idx] = ta.value; store("sl_polish", all);

    document.getElementById("res").innerHTML = `
      <div class="two" style="margin-top:14px">
        <div><p class="muted" style="margin:0 0 6px">내가 쓴 문장</p><div class="box">${highlightVague(ta.value).h}</div></div>
        <div><p class="muted" style="margin:0 0 6px">모범 수정안</p><div class="box" style="background:var(--tealL)">${esc(p.model)}</div></div></div>
      ${p.tip ? `<div class="reveal">${esc(p.tip)}</div>` : ""}
      <p class="muted" style="margin:14px 0 4px">스스로 점검해 보세요.</p>
      ${["답안에서 손가락으로 짚을 수 있는 행동(찾음, 연결함, 포함함 등)으로 썼는가?", "‘타당, 적절, 잘, 충실’ 같은 모호한 표현이 남아 있지 않은가?", "필요한 근거나 요소의 개수를 밝혔는가?", "글씨·분량이 아니라 평가하려는 내용을 기준으로 삼았는가?"].map((q) => `<label class="chk"><input type="checkbox"><span>${q}</span></label>`).join("")}
      <div class="row" style="margin-top:12px"><button class="btn teal" id="next">다음 문장</button></div>`;
    document.getElementById("next").onclick = () => polish(idx + 1);
  };
}

// 라우터
// =====================================================================
async function route() {
  cleanup();
  const h = location.hash.replace(/^#/, "");
  const [m, arg] = h.split("/");
  if (["room", "host", "play"].includes(m)) {
    $app.innerHTML = `<div class="card">연결 중…</div>`;
    await fbReady;
    if (!needDb()) return;
  }
  if (m === "room") roomEntry();
  else if (m === "host" && arg) hostView(arg);
  else if (m === "play" && arg) playView(arg);
  else if (m === "clinic") clinic();
  else if (m === "polish") polish();
  else home();
  window.scrollTo(0, 0);
}
route();
</script>
