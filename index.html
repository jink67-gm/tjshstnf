<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서·논술형 평가 연습실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFAF2; --card:#FFFFFF; --navy:#20313D; --navy2:#12314A; --teal:#168C88; --tealL:#E7F4F3;
  --orange:#EF8B4D; --orangeL:#FDEEE3; --line:#E4DCCF; --gray:#667782; --red:#D9534F; --green:#2E9E6A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:'Noto Sans KR',sans-serif;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;flex-direction:column}
.brand .bar{width:42px;height:4px;background:var(--orange);border-radius:2px;margin-bottom:8px}
.brand h1{margin:0;font-size:22px;font-weight:800}
.brand small{color:var(--gray)}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;background:var(--navy2);color:#fff}
.btn.teal{background:var(--teal)} .btn.orange{background:var(--orange)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.grid3{grid-template-columns:1fr}}
.mode{cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.mode:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.tag{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tealL);color:var(--teal)}
.tag.o{background:var(--orangeL);color:var(--orange)}
.tag.n{background:#EEF1F4;color:var(--navy2)}
.mode h3{margin:6px 0 0;font-size:19px}
.mode p{margin:0;color:var(--gray);font-size:14px}
h2{font-size:20px;margin:0 0 12px}
h3.step{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h3.step .num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:14px;align-items:center;justify-content:center}
.muted{color:var(--gray);font-size:14px}
.box{background:#FAF7F1;border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-wrap}
.item{font-size:16px}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:7px 0;background:#fff;cursor:pointer;font-size:15px}
label.chk input{margin-top:5px;transform:scale(1.15)}
label.chk.ok{border-color:var(--green);background:#EAF7F0}
label.chk.wrong{border-color:var(--red);background:#FCECEC}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.space{justify-content:space-between}
.progress{height:8px;background:#EEE6D9;border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--teal)}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--navy)}
textarea{min-height:90px;resize:vertical}
mark.v{background:#FFD9C2;color:var(--navy);border-radius:4px;padding:0 2px}
.flagline{margin-top:8px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
table.rb{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.rb th,table.rb td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
table.rb th{background:var(--navy2);color:#fff;text-align:center}
table.rb td.pt{text-align:center;font-weight:700;width:76px;white-space:nowrap}
table.rb tr.target td{background:var(--orangeL);border-color:var(--orange)}
table.rb tr.target td.pt::after{content:"고칠 칸";display:block;font-size:11px;color:var(--orange);font-weight:800}
.ans{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#fff}
.ans .who{font-weight:700;color:var(--teal);margin-bottom:6px}
.ans.big{font-size:17px;padding:18px;border-width:2px;border-color:var(--teal)}
.scorebtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.scorebtns button{min-width:64px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:16px;color:var(--navy)}
.scorebtns button.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.hist{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:8px}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.hist .bar{width:100%;background:var(--teal);border-radius:6px 6px 0 0;min-height:2px}
.hist .bar.gold{background:var(--orange)}
.hist .lab{font-size:12px;color:var(--gray);margin-top:4px}
.hist .num{font-size:13px;font-weight:700}
.split{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#FCECEC;color:var(--red)}
.agree{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#EAF7F0;color:var(--green)}
.bigcode{font-size:40px;font-weight:800;letter-spacing:6px;color:var(--teal)}
.stat{font-size:28px;font-weight:800}
.reveal{margin-top:10px;background:var(--orangeL);border-radius:10px;padding:10px 12px;font-size:14px}
.okbox{margin-top:10px;background:#EAF7F0;border-radius:10px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 12px;font-weight:700;color:var(--navy)}
.seg button.on{background:var(--navy2);color:#fff}
.note{font-size:13px;color:var(--gray)}
details summary{cursor:pointer}
.reasons{margin-top:8px;font-size:14px}
.reasons li{margin:3px 0}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.keys span{font-size:13px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:#fff}
.keys span.on{border-color:var(--green);background:#EAF7F0;color:var(--green);font-weight:700}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum td,table.sum th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
</style>
</head>

const $app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nl = (s) => esc(s).replace(/\n/g, "<br>");
let unsubs = [];
function cleanup() { unsubs.forEach((u) => u()); unsubs = []; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function myId() { let id = store("sl_pid"); if (!id) { id = "p" + Math.random().toString(36).slice(2, 10); store("sl_pid", id); } return id; }
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
const setById = (id) => SETS.find((s) => s.id === id);
function rubricTable(rows, target = -1) {
  return `<table class="rb"><tr><th>배점</th><th>채점 기준</th></tr>${rows.map(([p, t], i) => `<tr class="${i === target ? "target" : ""}"><td class="pt">${typeof p === "number" ? p + "점" : esc(p) + "점"}</td><td>${nl(t)}</td></tr>`).join("")}</table>`;
}

}

async function createRoom() {

    const cur = scores.filter((s) => s.round === room.round);

    const stats = set.answers.map((a, i) => {
      const counts = Object.fromEntries(set.points.map((p) => [p, 0]));
      let n = 0; const rs = [];
      cur.forEach((s) => { const v = s.scores && s.scores[i]; if (v !== undefined && v !== null) { counts[v] = (counts[v] || 0) + 1; n++; const r = s.reasons && s.reasons[i]; if (r) rs.push({ v, name: s.name, r }); } });
      const top = Math.max(0, ...Object.values(counts));
      return { counts, n, agree: n ? top / n : 0, rs: rs.sort((x, y) => y.v - x.v) };
    });
    const agreeAvg = (r) => {
      const rs = scores.filter((s) => s.round === r); if (!rs.length) return null;
      let sum = 0, k = 0;
      set.answers.forEach((a, i) => { const c = {}; let n = 0; rs.forEach((s) => { const v = s.scores && s.scores[i]; if (v !== undefined && v !== null) { c[v] = (c[v] || 0) + 1; n++; } }); if (n) { sum += Math.max(...Object.values(c)) / n; k++; } });

    };
    const a1 = agreeAvg(1), a2 = agreeAvg(2);
    $app.innerHTML = `
    <div class="card"><div class="row space">
      <div><span class="tag o">진행자 화면</span><h2 style="margin:8px 0 0">${esc(set.title)}</h2></div>

      </div>
      <p class="note" style="margin:10px 0 0">권장 순서: 초안 기준표로 1차 채점 → ‘의견이 갈림’ 답안의 채점 근거를 함께 읽으며 협의 → 2차 채점 시작 → 기준 점수·해설 공개</p>

          ${st.rs.length ? `<details class="reasons" data-d="${i}" ${openDetails.has(i) ? "open" : ""}><summary class="muted">채점 근거 ${st.rs.length}개 보기</summary><ul>${st.rs.map((r) => `<li><b>${r.v}점</b> · ${esc(r.name)}: ${esc(r.r)}</li>`).join("")}</ul></details>` : ""}

    const r2 = document.getElementById("round2"); if (r2) r2.onclick = () => { if (window.confirm("2차 채점을 시작할까요? 참여자 화면이 다듬은 기준표로 바뀌고 답안 1부터 다시 채점합니다.")) updateDoc(doc(db, "rooms", code), { round: 2, rubric: "v2", revealed: false }); };

        <p class="muted" style="margin:14px 0 6px">채점 근거(선택) · 기준표의 어느 문장을 보고 판단했는지 짧게 적으면 협의에 도움이 됩니다.</p>
        <textarea id="reason" maxlength="120" placeholder="예: C 사례는 해고 조건과 연결되지 않아 2점으로 판단함" style="min-height:64px">${esc(draft)}</textarea>
        ${room.revealed && mine[idx] !== undefined ? `<div class="reveal"><b>기준 점수 ${a.gold}점</b> · ${esc(a.why)}</div>` : ""}
        <div class="row space" style="margin-top:14px">
          <button class="btn ghost" id="prev" ${idx === 0 ? "disabled" : ""}>← 이전 답안</button>
          <button class="btn teal" id="submit" ${pick === null ? "disabled" : ""}>${idx === N - 1 ? "제출하고 마치기" : "제출하고 다음 답안 →"}</button>
        </div></div>`;
      $app.querySelectorAll(".scorebtns button").forEach((b) => (b.onclick = () => { pick = +b.dataset.p; draft = document.getElementById("reason").value; render(); }));
      document.getElementById("reason").oninput = (e) => { draft = e.target.value; };
      document.getElementById("prev").onclick = () => openAnswer(idx - 1);
      document.getElementById("submit").onclick = async () => {
        if (pick === null) return;
        mine[idx] = pick; reasons[idx] = draft.trim();
        const nextIdx = set.answers.findIndex((x, i) => i > idx && mine[i] === undefined);
        const firstMissing = set.answers.findIndex((x, i) => mine[i] === undefined);
        done = firstMissing === -1;
        try { await save(); } catch (e) { console.error(e); toast("저장에 실패했습니다. 다시 눌러 주세요."); return; }
        toast(`답안 ${idx + 1} 제출 완료`);
        if (done) { render(); window.scrollTo(0, 0); }
        else openAnswer(nextIdx !== -1 ? nextIdx : firstMissing);
      };
    }
    document.getElementById("toggleQ").onclick = () => { showQ = !showQ; const r = document.getElementById("reason"); if (r) draft = r.value; render(); };
  };
  unsubs.push(onSnapshot(doc(db, "rooms", code), async (s) => {
    if (!s.exists()) { $app.innerHTML = `<div class="card">방을 찾을 수 없습니다.</div>`; return; }
    const r = document.getElementById("reason"); if (r) draft = r.value;
    room = s.data();
    if (room.round !== curRound) {
      curRound = room.round; mine = {}; reasons = {}; idx = 0; done = false; pick = null; draft = "";
      const my = await getDoc(doc(db, "rooms", code, "scores", `${pid}_r${room.round}`));
      if (my.exists()) {
        const d = my.data(); const sc = d.scores || {}; const rs = d.reasons || {};
        Object.keys(sc).forEach((k) => (mine[+k] = sc[k])); Object.keys(rs).forEach((k) => (reasons[+k] = rs[k]));
        done = !!d.done;
        const N = setById(room.setId).answers.length;
        const fm = [...Array(N).keys()].find((i) => mine[i] === undefined);
        if (!done) { idx = fm === undefined ? 0 : fm; pick = mine[idx] !== undefined ? mine[idx] : null; draft = reasons[idx] || ""; }
      }
    }
    render();
  }, (e) => { console.error(e); toast("연결 오류: Firestore 설정을 확인해 주세요."); }));
}

// =====================================================================
// 모드 2: 문항 검토 클리닉 (문항·보기 무작위, 정답 1개)
// =====================================================================
function clinicStart() {
  const order = shuffle(CLINIC.map((c, i) => i)).map((i) => ({ i, opts: shuffle(CLINIC[i].opts) }));
  clinic(order, 0, 0);
}
function clinic(order, pos, correct) {
  if (pos >= order.length) {
    $app.innerHTML = `<div class="card" style="text-align:center"><span class="tag">문항 검토 클리닉</span><h2 style="margin-top:10px">연습을 마쳤습니다</h2>
      <div class="stat">${correct} / ${order.length}</div><p class="muted">정확하게 진단한 문항 수</p>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn teal" id="again">순서를 바꾸어 다시 하기</button><button class="btn ghost" id="toHome">처음으로</button></div></div>`;
    document.getElementById("again").onclick = clinicStart;
    document.getElementById("toHome").onclick = () => { location.hash = ""; };
    return;
  }
  const { i, opts } = order[pos]; const c = CLINIC[i];
  $app.innerHTML = `
  <div class="card"><div class="row space"><span class="tag">문항 검토 클리닉 · ${pos + 1} / ${order.length}</span><span class="note">맞힌 문항 ${correct}개</span></div>
    <div class="progress" style="margin-top:10px"><div style="width:${(pos / order.length) * 100}%"></div></div></div>
  <div class="card"><div class="row" style="margin-bottom:8px"><span class="tag n">${esc(c.subj)}</span></div>
    <h2>이 문항에서 가장 먼저 고쳐야 할 점은 무엇일까요?</h2>
    <div class="box item">${nl(c.item)}</div>
    <p class="muted" style="margin:14px 0 4px">가장 알맞은 것을 하나 고르세요.</p>
    <div id="opts">${opts.map((k) => `<label class="chk" data-k="${k}"><input type="radio" name="opt" value="${k}"><span>${esc(TYPES[k])}</span></label>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn orange" id="check">진단 확인</button></div>
    <div id="result"></div></div>`;
  document.getElementById("check").onclick = () => {
    const sel = document.querySelector("#opts input:checked");
    if (!sel) return toast("하나를 골라 주세요.");
    const ok = sel.value === c.ans;
    document.querySelectorAll("#opts label").forEach((l) => {
      l.querySelector("input").disabled = true;
      if (l.dataset.k === c.ans) l.classList.add("ok"); else if (l.dataset.k === sel.value) l.classList.add("wrong");
    });
    document.getElementById("check").remove();
    document.getElementById("result").innerHTML = `
      <div class="${ok ? "okbox" : "reveal"}" style="margin-top:14px"><b>${ok ? "정확하게 진단했습니다." : "다시 살펴보세요. 초록색이 정답입니다."}</b><br>${esc(c.why)}</div>
      <p class="muted" style="margin:14px 0 6px">수정 예시</p><div class="box item" style="background:var(--tealL)">${nl(c.fix)}</div>
      <div class="row" style="margin-top:12px"><button class="btn teal" id="next">다음 문항</button></div>`;
    document.getElementById("next").onclick = () => clinic(order, pos + 1, correct + (ok ? 1 : 0));
  };
}

// =====================================================================
// 모드 3: 기준 문장 다듬기 (상황 → 문제 확인 → 고쳐 쓰기 → 비교)
// =====================================================================
function highlightVague(text) {
  let h = esc(text); const found = [];
  VAGUE.forEach((w) => { const ww = w.trim(); if (!ww) return; if (text.includes(ww)) { found.push(ww); h = h.split(esc(ww)).join(`<mark class="v">${esc(ww)}</mark>`); } });
  return { h, found };
}
function polish(idx = 0) {
  if (idx >= POLISH.length) {
    $app.innerHTML = `<div class="card" style="text-align:center"><span class="tag">기준 문장 다듬기</span><h2 style="margin-top:10px">연습을 마쳤습니다</h2>
      <p class="muted">내 문항의 채점기준표에서도 판단이 갈릴 만한 칸을 찾아 같은 방법으로 고쳐 보세요.</p>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn teal" id="again">다시 하기</button><button class="btn ghost" id="toHome">처음으로</button></div></div>`;
    document.getElementById("again").onclick = () => polish(0);
    document.getElementById("toHome").onclick = () => { location.hash = ""; };
    return;
  }
  const p = POLISH[idx]; const s = p.set; const tgt = p.rubric[p.target];
  const tgtPt = typeof tgt[0] === "number" ? tgt[0] + "점" : tgt[0] + "점";
  const saved = (store("sl_polish3") || {})[idx] || "";
  $app.innerHTML = `
  <div class="card"><div class="row space"><span class="tag">기준 문장 다듬기 · ${idx + 1} / ${POLISH.length}</span>
    <div class="row"><button class="btn ghost sm" id="prevP" ${idx === 0 ? "disabled" : ""}>이전</button><button class="btn ghost sm" id="skipP">건너뛰기</button></div></div>
    <div class="progress" style="margin-top:10px"><div style="width:${(idx / POLISH.length) * 100}%"></div></div></div>

  <div class="card"><h3 class="step"><span class="num">1</span>상황 보기</h3>
    <div class="row" style="margin-bottom:8px"><span class="tag n">${esc(s.title)}</span></div>
    ${s.achieve ? `<p class="note" style="margin:0 0 6px">${esc(s.achieve)}</p>` : ""}
    <p class="muted" style="margin:0 0 6px">문항</p><div class="box item">${nl(s.question)}</div>
    ${s.context ? `<details style="margin-top:8px"><summary class="muted">제시 자료 보기</summary><div class="box" style="margin-top:8px;font-size:14px">${nl(s.context)}</div></details>` : ""}
    <p class="muted" style="margin:14px 0 6px">이 문항의 채점기준표 초안 (주황색 칸이 이번에 고칠 칸입니다)</p>
    ${rubricTable(p.rubric, p.target)}
  </div>

  <div class="card"><h3 class="step"><span class="num">2</span>왜 고쳐야 할까요?</h3>
    <div class="reveal" style="margin-top:0">${esc(p.problem)}</div>
    <p class="muted" style="margin:14px 0 6px">이 기준으로 아래 학생 답안을 채점해 보세요.</p>
    <div class="ans">${nl(p.sample)}</div>
    <p style="margin:6px 0"><b>${esc(p.sampleQ)}</b></p>
    <details><summary class="muted">판단이 갈리는 이유 보기</summary><div class="box" style="margin-top:8px;font-size:14px">${esc(p.sampleWhy)}</div></details>
  </div>

  <div class="card"><h3 class="step"><span class="num">3</span>${esc(tgtPt)} 칸의 문장을 고쳐 쓰기</h3>
    <p class="muted" style="margin:0 0 6px">고칠 문장</p>
    <div class="box item">${highlightVague(tgt[1]).h}</div>
    <p class="muted" style="margin:12px 0 6px">누가 채점해도 같은 점수가 나오도록, 학생이 무엇을 몇 가지 써야 하는지가 드러나는 문장으로 고쳐 쓰세요. 아래 요소가 문장에 담기면 초록색으로 바뀝니다.</p>
    <div class="keys" id="keys">${p.keys.map((k, j) => `<span data-j="${j}">${esc(k.label)}</span>`).join("")}</div>
    <textarea id="mine" style="margin-top:10px" placeholder="예: <자료>에서 ○○를 ○가지 찾고, ○○와 연결하여 쓴 경우">${esc(saved)}</textarea>
    <p class="flagline" id="live"></p>
    <div class="row" style="margin-top:8px"><button class="btn orange" id="cmp">모범 수정안과 비교</button></div>
    <div id="res"></div></div>`;
  const ta = document.getElementById("mine"), live = document.getElementById("live");
  const upd = () => {
    const v = ta.value; const f = highlightVague(v).found;
    p.keys.forEach((k, j) => { document.querySelector(`#keys span[data-j="${j}"]`).classList.toggle("on", new RegExp(k.re).test(v)); });
    live.innerHTML = v.trim() ? (f.length ? `<span style="color:var(--red)">아직 남아 있는 모호한 표현: ${f.map((w) => `<mark class="v">${esc(w)}</mark>`).join(" ")}</span>` : `<span style="color:var(--green)">모호한 표현이 없습니다.</span>`) : "";
    const all = store("sl_polish3") || {}; all[idx] = v; store("sl_polish3", all);
  };
  ta.oninput = upd; upd();
  document.getElementById("prevP").onclick = () => { polish(idx - 1); window.scrollTo(0, 0); };
  document.getElementById("skipP").onclick = () => { polish(idx + 1); window.scrollTo(0, 0); };
  document.getElementById("cmp").onclick = () => {
    if (!ta.value.trim()) return toast("먼저 고친 문장을 써 주세요.");
    document.getElementById("cmp").remove();
    const hit = p.keys.filter((k) => new RegExp(k.re).test(ta.value)).length;
    document.getElementById("res").innerHTML = `
      <h3 class="step" style="margin-top:18px"><span class="num">4</span>비교하기</h3>
      <div class="two">
        <div><p class="muted" style="margin:0 0 6px">내가 쓴 문장 (필요 요소 ${hit}/${p.keys.length})</p><div class="box">${highlightVague(ta.value).h}</div></div>
        <div><p class="muted" style="margin:0 0 6px">모범 수정안</p><div class="box" style="background:var(--tealL)">${esc(p.model)}</div></div></div>
      <p class="muted" style="margin:14px 0 4px">고친 기준으로 2단계의 학생 답안을 다시 채점해 보세요. 누가 채점해도 같은 점수가 나오나요?</p>
      ${["답안에 무엇이 들어 있는지만 보고 점수를 정할 수 있는 문장인가?", "‘타당, 적절, 충실, 다소’ 같은 모호한 표현이 남아 있지 않은가?", "문항이 요구한 근거·요소의 개수를 밝혔는가?", "글씨·분량이 아니라 평가하려는 내용을 기준으로 삼았는가?"].map((q) => `<label class="chk"><input type="checkbox"><span>${q}</span></label>`).join("")}
      <div class="row" style="margin-top:12px"><button class="btn teal" id="next">다음 연습</button></div>`;
    document.getElementById("next").onclick = () => { polish(idx + 1); window.scrollTo(0, 0); };
  };
}

// =====================================================================
// 라우터
// =====================================================================
async function route() {
  cleanup();
  const h = location.hash.replace(/^#/, "");
  const [m, arg] = h.split("/");
  if (["room", "host", "play"].includes(m)) {
    $app.innerHTML = `<div class="card">연결 중…</div>`;
    await fbReady;
    if (!needDb()) return;
  }
  if (m === "room") roomEntry();
  else if (m === "host" && arg) hostView(arg);
  else if (m === "play" && arg) playView(arg);
  else if (m === "clinic") clinicStart();
  else if (m === "polish") polish();
  else home();
  window.scrollTo(0, 0);
}
route();
</script>
